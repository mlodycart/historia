<!DOCTYPE html>
<html lang="pl">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historia - Quiz ABCD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { background-color: #121212; color: #fff; font-family: 'Space Grotesk', sans-serif; font-weight: 500; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .back-nav { width: 100%; max-width: 1200px; padding: 20px 20px 0 20px; display: flex; justify-content: flex-start; }
        .back-btn { background-color: #2a2a2a; color: #ffd700; border: 2px solid #444; padding: 10px 20px; font-family: inherit; font-size: 16px; font-weight: 700; border-radius: 8px; cursor: pointer; text-decoration: none; transition: background-color 0.2s; }
        .back-btn:hover { background-color: #3d3d3d; }

        .tab-content { display: block; width: 100%; max-width: 1200px; padding: 20px 20px 80px 20px; }
        .quiz-container { background-color: #2d2d2d; padding: 40px 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); text-align: center; max-width: 1200px; margin: 10px auto; position: relative; }
        
        .quiz-reset-btn { position: absolute; top: 20px; right: 20px; width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; background: #262626; border: 2px solid #555; border-radius: 12px; color: #fff; cursor: pointer; text-decoration: none; transition: all 0.2s; }
        .quiz-reset-btn:hover { background-color: #333; border-color: #ffd700; color: #ffd700; }

        h1 { color: #4CAF50; margin-top: 0; font-size: 38px; font-weight: 700; margin-bottom: 15px; }
        
        .translation-box { background-color: #3d3d3d; padding: 25px; border-radius: 16px; margin-bottom: 30px; }
        .translation-label { font-size: 16px; color: #aaa; margin-bottom: 8px; text-transform: uppercase; }
        .translation-value { font-size: 36px; font-weight: 700; color: #ffd700; word-break: break-word; }
        
        .options-grid { display: flex; flex-direction: column; gap: 16px; margin-bottom: 30px; }
        .option-btn { background-color: #3d3d3d; color: white; border: 3px solid #555; padding: 20px 24px; font-family: inherit; font-weight: 700; font-size: 18px; border-radius: 14px; cursor: pointer; transition: all 0.2s; text-align: left; width: 100%; line-height: 1.4; }
        .option-btn:hover:not(:disabled) { background-color: #4d4d4d; border-color: #ffd700; color: #ffd700; }
        .option-btn.correct-ans { background-color: #2e7d32 !important; border-color: #4CAF50 !important; color: #fff !important; }
        .option-btn.wrong-ans { background-color: #c62828 !important; border-color: #f44336 !important; }
        
        .action-buttons-wrapper { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; width: 100%; }
        .btn-action { background-color: #4CAF50; color: white; border: none; padding: 18px 40px; font-family: inherit; font-weight: 700; font-size: 22px; border-radius: 12px; cursor: pointer; transition: background-color 0.3s; width: 100%; max-width: 320px; }
        .btn-action:hover { background-color: #45a049; }
        .btn-next { background-color: #2196F3 !important; }
        .btn-skip { background-color: #757575 !important; }
        .btn-end { background-color: #e53935 !important; }
        .btn-retry-wrong { background-color: #ff9800 !important; }

        .feedback { margin-top: 25px; font-size: 22px; font-weight: 700; min-height: 40px; line-height: 1.4; }
        .correct { color: #4CAF50; }
        .incorrect { color: #f44336; }
        .skipped-text { color: #aaa; }
        .counter { font-size: 18px; color: #aaa; margin-bottom: 15px; }

        .summary-container { text-align: left; margin-top: 20px; }
        .summary-title { font-size: 28px; color: #4CAF50; font-weight: 700; text-align: center; margin-bottom: 20px; }
        .summary-score { font-size: 22px; text-align: center; margin-bottom: 30px; color: #fff; }
        .summary-list { background-color: #1e1e1e; border-radius: 12px; padding: 15px; border: 2px solid #444; display: flex; flex-direction: column; gap: 12px; }
        .summary-item { background-color: #2a2a2a; border-radius: 10px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; border-left: 6px solid #555; gap: 10px; flex-wrap: wrap; }
        .summary-item.perfect { border-left-color: #4CAF50; }
        .summary-item.failed { border-left-color: #e53935; }
        .summary-item.skipped { border-left-color: #888; background-color: #222; }
        .summary-item-content { flex-grow: 1; font-size: 18px; line-height: 1.5; }
        .summary-num { font-weight: bold; color: #888; margin-right: 8px; }
        .summary-word { font-weight: bold; font-size: 20px; }
        .summary-score-badge { font-size: 20px; font-weight: 700; padding: 8px 16px; border-radius: 8px; background-color: #1a1a1a; border: 1px solid #444; }
        .summary-details { font-size: 15px; margin-top: 6px; color: #ccc; }
        .text-correct { color: #4CAF50; font-weight: bold; }
        .text-wrong { color: #e53935; font-weight: bold; text-decoration: line-through; }
        .text-skipped { color: #888; }
        .summary-footer-bar { margin-top: 25px; background-color: #2d2d2d; padding: 16px 20px; border-radius: 20px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
    </style>
</head>
<body>

    <div class="back-nav">
        <a href="index.html" class="back-btn">&#8592; Strona główna</a>
    </div>

    <div class="tab-content">
        <div class="quiz-container" id="abcd-quiz-box">
            <a href="#" class="quiz-reset-btn" onclick="restartAbcdQuiz(); return false;" title="Resetuj">
                <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                    <path d="M3 3v5h5"></path>
                </svg>
            </a>
            <h1>Quiz: Wybierz Poprawną Odpowiedź</h1>
            <div class="counter" id="abcd-counter-text"></div>
            <div class="counter" id="abcd-progress-text" style="color: #4CAF50; margin-top: -8px; margin-bottom: 20px; font-weight: 700;"></div>
            
            <div class="translation-box">
                <div class="translation-label">Zagadnienie</div>
                <div class="translation-value" id="abcd-val-translation">-</div>
            </div>

            <div class="options-grid" id="abcd-options-container"></div>

            <div class="action-buttons-wrapper">
                <button class="btn-action btn-skip" id="abcd-skip-btn" onclick="skipAbcdQuestion()">Pomiń pytanie</button>
                <button class="btn-action btn-end" id="abcd-end-btn" onclick="showAbcdSummary()">Zakończ quiz</button>
                <button class="btn-action btn-next" id="abcd-next-btn" onclick="loadNextAbcdQuestion()" style="display: none;">Następne pytanie</button>
            </div>

            <div class="feedback" id="abcd-feedback"></div>
        </div>
    </div>

    <script src="historyData.js"></script>
    <script>
        let abcdTotalPool = [...historyData];
        let abcdAvailableWords = [], abcdCurrentWord = {}, abcdScoreCorrect = 0, abcdQuestionNumber = 0;
        let abcdSkippedCount = 0, abcdHistory = [];

        function initAbcdQueue(customPool = null) { 
            abcdTotalPool = customPool ? [...customPool] : [...historyData];
            abcdAvailableWords = [...abcdTotalPool].sort(() => Math.random() - 0.5); 
            abcdQuestionNumber = 0; abcdScoreCorrect = 0; abcdSkippedCount = 0; abcdHistory = [];
        }

        function loadNextAbcdQuestion() {
            if (!abcdAvailableWords.length) { showAbcdSummary(); return; }
            abcdQuestionNumber++;
            abcdCurrentWord = abcdAvailableWords.pop();

            document.getElementById("abcd-feedback").innerHTML = "";
            document.getElementById("abcd-next-btn").style.display = "none";
            document.getElementById("abcd-skip-btn").style.display = "inline-block";
            document.getElementById("abcd-end-btn").style.display = "inline-block";
            document.getElementById("abcd-val-translation").innerText = abcdCurrentWord.title;
            document.getElementById("abcd-counter-text").innerText = `Poprawne: ${abcdScoreCorrect} / ${abcdHistory.length}`;
            document.getElementById("abcd-progress-text").innerText = `Pytanie: ${abcdQuestionNumber} / ${abcdTotalPool.length} | Pominięto: ${abcdSkippedCount}`;

            let others = historyData.filter(w => w.id !== abcdCurrentWord.id).sort(() => Math.random() - 0.5);
            let options = [
                { text: abcdCurrentWord.desc, isCorrect: true },
                { text: others[0].desc, isCorrect: false },
                { text: others[1].desc, isCorrect: false }
            ].sort(() => Math.random() - 0.5);

            const container = document.getElementById("abcd-options-container");
            container.innerHTML = "";
            options.forEach(opt => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = opt.text;
                btn.onclick = () => handleAbcdAnswer(btn, opt.isCorrect, abcdCurrentWord.desc);
                container.appendChild(btn);
            });
        }

        function handleAbcdAnswer(selectedBtn, isCorrect, correctAnswerStr) {
            document.querySelectorAll(".option-btn").forEach(btn => {
                btn.disabled = true;
                if (btn.innerText === correctAnswerStr) btn.classList.add("correct-ans");
            });

            abcdHistory.push({ item: abcdCurrentWord, userAnswer: selectedBtn.innerText, correctAnswer: correctAnswerStr, isCorrect, skipped: false });

            const feedbackEl = document.getElementById("abcd-feedback");
            if (isCorrect) {
                abcdScoreCorrect++;
                feedbackEl.innerHTML = "<span class='correct'>Dobrze! 🎉</span>";
            } else {
                selectedBtn.classList.add("wrong-ans");
                feedbackEl.innerHTML = `<span class='incorrect'>Źle. Poprawna odpowiedź to:<br><strong>${correctAnswerStr}</strong></span>`;
            }

            document.getElementById("abcd-counter-text").innerText = `Poprawne: ${abcdScoreCorrect} / ${abcdHistory.length}`;
            document.getElementById("abcd-skip-btn").style.display = "none";
            document.getElementById("abcd-end-btn").style.display = "inline-block";
            document.getElementById("abcd-next-btn").style.display = "inline-block";
        }

        function skipAbcdQuestion() {
            abcdSkippedCount++;
            const correctAnswerStr = abcdCurrentWord.desc;

            document.querySelectorAll(".option-btn").forEach(btn => {
                btn.disabled = true;
                if (btn.innerText === correctAnswerStr) btn.classList.add("correct-ans");
            });

            abcdHistory.push({ item: abcdCurrentWord, userAnswer: "(Pominięto)", correctAnswer: correctAnswerStr, isCorrect: false, skipped: true });

            document.getElementById("abcd-feedback").innerHTML = `<span class='skipped-text'>Pominięto pytanie. Poprawna odpowiedź została zaznaczona na zielono.</span>`;
            document.getElementById("abcd-skip-btn").style.display = "none";
            document.getElementById("abcd-end-btn").style.display = "inline-block";
            document.getElementById("abcd-next-btn").style.display = "inline-block";
        }

        function showAbcdSummary() {
            const box = document.getElementById("abcd-quiz-box");
            let retryWords = [];

            let listHtml = abcdHistory.map((h, idx) => {
                if (h.skipped || !h.isCorrect) retryWords.push(h.item);
                if (h.skipped) {
                    return `
                        <div class="summary-item skipped">
                            <div class="summary-item-content">
                                <div><span class="summary-num">${idx + 1}.</span><span class="summary-word">${h.item.title}</span></div>
                                <div class="summary-details"><span class="text-skipped">${h.correctAnswer}</span></div>
                            </div>
                            <div class="summary-score-badge">0/1</div>
                        </div>
                    `;
                }
                const statusClass = h.isCorrect ? 'perfect' : 'failed';
                let detailsHtml = h.isCorrect 
                    ? `<span class="text-correct">${h.userAnswer}</span>`
                    : `<span class="text-wrong">${h.userAnswer}</span> → <span class="text-correct">${h.correctAnswer}</span>`;

                return `
                    <div class="summary-item ${statusClass}">
                        <div class="summary-item-content">
                            <div><span class="summary-num">${idx + 1}.</span><span class="summary-word">${h.item.title}</span></div>
                            <div class="summary-details">${detailsHtml}</div>
                        </div>
                        <div class="summary-score-badge">${h.isCorrect ? '1/1' : '0/1'}</div>
                    </div>
                `;
            }).join('');

            const percent = abcdHistory.length > 0 ? Math.round((abcdScoreCorrect / abcdHistory.length) * 100) : 0;
            window.abcdWrongWordsCache = retryWords;

            let retryBtnHtml = retryWords.length > 0 
                ? `<button class="btn-action btn-retry-wrong" onclick="retryAbcdWrongWords()">Powtórz błędne (${retryWords.length})</button>`
                : '';

            box.innerHTML = `
                <a href="#" class="quiz-reset-btn" onclick="restartAbcdQuiz(); return false;" title="Resetuj">
                    <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                        <path d="M3 3v5h5"></path>
                    </svg>
                </a>
                <h1>Koniec Quizu! 🎉</h1>
                <div class="summary-score">Twój wynik całkowity: <strong>${abcdScoreCorrect} / ${abcdHistory.length}</strong> (${percent}%)</div>
                <div class="summary-container">
                    <div class="summary-title">Podsumowanie odpowiedzi:</div>
                    <div class="summary-list">${listHtml}</div>
                </div>
                <div class="summary-footer-bar">
                    <button class="btn-action" onclick="restartAbcdQuiz()">Zagraj ponownie</button>
                    ${retryBtnHtml}
                </div>
            `;
        }

        function retryAbcdWrongWords() { location.reload(); }
        function restartAbcdQuiz() { location.reload(); }

        window.onload = function() {
            initAbcdQueue();
            loadNextAbcdQuestion();
        };
    </script>
</body>
</html>
